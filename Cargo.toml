[package]
name = "actit"
version = "0.1.0"
edition = "2021"
description = "Does a tool already exist for this need? Answers from indexer and kag only."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
